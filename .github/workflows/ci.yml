name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, data integrity, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The review log is the single source of truth; this fails the build when
      # something else has drifted away from it.
      - name: Data integrity
        run: pnpm check:data

      # Build the artifact that actually ships.
      - name: Static export
        run: pnpm build:static

      - name: Report export size
        run: du -sh out
