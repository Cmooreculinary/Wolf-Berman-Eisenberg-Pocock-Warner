name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, data integrity, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The review log is the single source of truth; this fails the build when
      # something else has drifted away from it.
      - name: Data integrity
        run: pnpm check:data

      # Build the artifact that actually ships. `build:static` regenerates the
      # published JSON first, so the export carries it.
      - name: Static export
        run: pnpm build:static

      # A broken export is invisible in review: the pages render fine while
      # every integration 404s.
      - name: Machine-readable endpoints published
        run: pnpm check:export

      - name: MCP server answers over stdio
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_overview","arguments":{}}}' \
          | EPWWB_BASE_URL="file://$PWD/out" node integrations/mcp/server.mjs \
          | tee /dev/stderr \
          | grep -q 'Rolling four-week intelligence'

      - name: Report export size
        run: du -sh out
